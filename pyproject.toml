[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "manual-ingestion"
version = "0.1.0"
description = "Ingest PDF manuals into Azure AI Search for Microsoft Foundry agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2,<2",
    "azure-ai-projects>=2.3.0,<3",
    "azure-identity>=1.19.0,<2",
    "azure-search-documents>=11.6.0,<12",
    "azure-storage-blob>=12.24.0,<13",
    "openai>=1.58.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.9.0,<1",
]

[project.scripts]
manual-ingestion = "manual_ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manual_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
